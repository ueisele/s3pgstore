# golangci-lint v2 configuration.
# https://golangci-lint.run/usage/configuration/
version: "2"

run:
  # Intentionally NO integration build tag. Excluding `//go:build
  # integration` files lets `unused` flag production code that is
  # only kept alive by an integration test — that pattern is dead
  # code we want surfaced, not hidden. Helpers defined inside the
  # integration files themselves (fixtures, integration-test-only
  # helpers) are also excluded from view, so the rule does not
  # false-positive on them. Syntax/semantics coverage on
  # integration test bodies is provided by `go vet -tags=integration`
  # in the verification gates.

linters:
  # Start from zero, enable only what we've decided to use — more
  # predictable than starting from "standard" and opting out.
  default: none
  enable:
    - copyloopvar   # pre-Go-1.22 loop-variable capture (safety net)
    - durationcheck # time.Second * time.Second footgun
    - errcheck      # unchecked errors (real bug finder)
    - govet         # standard Go analyzers
    - ineffassign   # assigned values never read
    - makezero      # make([]T, N) + append(s, x) — meant len 0 cap N
    - misspell      # typos in comments + strings
    - nilerr        # `if err != nil { return nil }` anti-pattern
    - nolintlint    # //nolint directives must be well-formed
    - staticcheck   # absorbs gosimple + stylecheck in v2
    - unparam       # unused function params + always-same/always-nil returns
    - unused        # dead code, unused fields/consts

  settings:
    errcheck:
      # Deferred Close / Rollback calls are idiomatic fire-and-forget.
      # Same for best-effort cleanup of orphan S3 objects.
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (github.com/jackc/pgx/v5.Tx).Rollback
        - (github.com/jackc/pgx/v5/pgxpool.Conn).Release

formatters:
  enable:
    - gofmt         # baseline: what gofmt enforces
    - goimports     # import ordering + grouping
